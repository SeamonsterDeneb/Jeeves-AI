<!-- The JavaScript inline snippet simply replicates the value to a data attribute -->
<div class="phone-screen">
  <div class="results">Top Portion</div>
  <div class="grow-wrap">
    <textarea
      rows="1"
      placeholder="Type here..."
      onInput="this.parentNode.dataset.replicatedValue = this.value"
    ></textarea>
  </div>
</div>

<style>
  .results {
    background: tan;
    height: 300px;
  }
  .phone-screen {
    height: 600px;
    width: 400px;
    outline: solid 2px blue;
    display: flex;
    flex-direction: column;
    justify-content: space-between
  }
  .grow-wrap {
    display: inline-grid;
    width: 100%;
    max-width: 500px;
  }
  
  /* Treat both the pseudo-element and the textarea as the same grid cell */
  .grow-wrap::after,
  .grow-wrap textarea {
    grid-area: 1 / 1 / 2 / 2;
    font: inherit;
    padding: 0.5rem;
    border: 1px solid #ccc;
  }
  
  /* This invisible pseudo-element stretches the container */
  .grow-wrap::after {
    content: attr(data-replicated-value) " ";
    white-space: pre-wrap;
    visibility: hidden;
  }
  
  .grow-wrap textarea {
    resize: none;
    overflow: hidden;
  }
</style>
